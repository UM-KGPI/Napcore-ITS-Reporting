openapi: 3.1.0
info:
  title: mobilityDCAT-AP Pilot BFF API
  version: 0.1.0
  description: |
    Initial API contract for the web application's Backend-for-Frontend layer.
servers:
  - url: https://pilot.example.eu/api
    description: Pilot environment
tags:
  - name: Ingestion
  - name: Validation
  - name: Reporting
  - name: Workflow
  - name: Recommendations
paths:
  /ingestions:
    post:
      tags: [Ingestion]
      summary: Start metadata ingestion job
      operationId: startIngestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestionRequest'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncJobAccepted'
  /validations:
    post:
      tags: [Validation]
      summary: Start compliance validation
      operationId: startValidation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationRequest'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncJobAccepted'
  /validations/{validationId}:
    get:
      tags: [Validation]
      summary: Get validation status and summary
      operationId: getValidation
      parameters:
        - $ref: '#/components/parameters/ValidationId'
      responses:
        '200':
          description: Validation state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationSummary'
        '404':
          $ref: '#/components/responses/NotFound'
  /reports:
    post:
      tags: [Reporting]
      summary: Start report generation
      operationId: startReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncJobAccepted'
  /reports/{reportId}:
    get:
      tags: [Reporting]
      summary: Get report status
      operationId: getReport
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: Report status and output links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSummary'
        '404':
          $ref: '#/components/responses/NotFound'
  /reports/{reportId}/exports/{format}:
    get:
      tags: [Reporting]
      summary: Download generated report export
      operationId: downloadReportExport
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - name: format
          in: path
          required: true
          schema:
            type: string
            enum: [pdf, html, json]
      responses:
        '200':
          description: Binary or JSON export payload
  /workflow/{workflowId}:
    get:
      tags: [Workflow]
      summary: Get guided workflow progress
      operationId: getWorkflowProgress
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current guided workflow step
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowProgress'
  /recommendations/{contextId}:
    get:
      tags: [Recommendations]
      summary: Get recommendations for improving metadata quality
      operationId: getRecommendations
      parameters:
        - name: contextId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Recommendations list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Recommendation'
components:
  parameters:
    ValidationId:
      name: validationId
      in: path
      required: true
      schema:
        type: string
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        type: string
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    AsyncJobAccepted:
      type: object
      required: [jobId, status, submittedAt]
      properties:
        jobId:
          type: string
        status:
          type: string
          enum: [accepted, running]
        submittedAt:
          type: string
          format: date-time
    IngestionRequest:
      type: object
      required: [sources, formats]
      properties:
        sources:
          type: array
          items:
            type: string
            format: uri
        formats:
          type: array
          items:
            type: string
            enum: [json-ld, ttl, rdf-xml]
    ValidationRequest:
      type: object
      required: [datasetRef, profileVersion]
      properties:
        datasetRef:
          type: string
        profileVersion:
          type: string
        strictMode:
          type: boolean
          default: true
    ValidationSummary:
      type: object
      required: [validationId, status, score, findings]
      properties:
        validationId:
          type: string
        status:
          type: string
          enum: [accepted, running, completed, failed]
        score:
          type: number
          minimum: 0
          maximum: 100
        findings:
          type: array
          items:
            $ref: '#/components/schemas/ValidationFinding'
    ValidationFinding:
      type: object
      required: [code, severity, message]
      properties:
        code:
          type: string
        severity:
          type: string
          enum: [info, warning, error]
        message:
          type: string
        path:
          type: string
        recommendation:
          type: string
    ReportRequest:
      type: object
      required: [period, scope, mode]
      properties:
        period:
          type: string
          example: 2026-Q2
        scope:
          type: string
          enum: [national, regional, operator]
        mode:
          type: string
          enum: [guided, semi-auto, auto]
    ReportSummary:
      type: object
      required: [reportId, status, generatedAt]
      properties:
        reportId:
          type: string
        status:
          type: string
          enum: [accepted, running, completed, failed]
        generatedAt:
          type: string
          format: date-time
        exports:
          type: array
          items:
            type: object
            properties:
              format:
                type: string
                enum: [pdf, html, json]
              downloadUrl:
                type: string
                format: uri
    WorkflowProgress:
      type: object
      required: [workflowId, step, completedSteps]
      properties:
        workflowId:
          type: string
        step:
          type: string
        completedSteps:
          type: array
          items:
            type: string
        nextAction:
          type: string
    Recommendation:
      type: object
      required: [id, severity, text]
      properties:
        id:
          type: string
        severity:
          type: string
          enum: [low, medium, high]
        text:
          type: string
        relatedRule:
          type: string
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
