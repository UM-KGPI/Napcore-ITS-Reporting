openapi: 3.1.0
info:
  title: Compliance Validation Service API
  version: 0.1.0
  description: API contract for metadata compliance validation.
servers:
  - url: https://pilot.example.eu/validation
paths:
  /jobs:
    post:
      summary: Start validation job
      operationId: startValidationJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartValidationJobRequest'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationJobAccepted'
  /jobs/{jobId}:
    get:
      summary: Get validation job status
      operationId: getValidationJob
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationJobStatus'
  /jobs/{jobId}/findings:
    get:
      summary: Get paged findings for validation job
      operationId: listValidationFindings
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
        - name: severity
          in: query
          schema:
            type: string
            enum: [info, warning, error]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Findings page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFindingPage'
components:
  schemas:
    StartValidationJobRequest:
      type: object
      required: [datasetRef, profileVersion]
      properties:
        datasetRef:
          type: string
        profileVersion:
          type: string
          example: mobilitydcat-ap-2.0.0
        includeRecommendations:
          type: boolean
          default: true
        strictMode:
          type: boolean
          default: true
    ValidationJobAccepted:
      type: object
      required: [jobId, status, submittedAt]
      properties:
        jobId:
          type: string
        status:
          type: string
          enum: [accepted]
        submittedAt:
          type: string
          format: date-time
    ValidationJobStatus:
      type: object
      required: [jobId, status, score]
      properties:
        jobId:
          type: string
        status:
          type: string
          enum: [accepted, running, completed, failed]
        score:
          type: number
          minimum: 0
          maximum: 100
        counts:
          type: object
          properties:
            info:
              type: integer
            warning:
              type: integer
            error:
              type: integer
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
    ValidationFindingPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ValidationFinding'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    ValidationFinding:
      type: object
      required: [id, code, severity, message]
      properties:
        id:
          type: string
        code:
          type: string
        severity:
          type: string
          enum: [info, warning, error]
        message:
          type: string
        ruleVersion:
          type: string
        targetPath:
          type: string
        recommendation:
          type: string
